services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frontend_chat}
      POSTGRES_USER: ${POSTGRES_USER:-frontend_chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: node:22-bookworm-slim
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-frontend_chat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frontend_chat}
      AUTH_PEPPER: ${AUTH_PEPPER:?set AUTH_PEPPER}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      INVITE_CODE: ${INVITE_CODE:?set INVITE_CODE}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-host}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      EVENT_SLUG: ${EVENT_SLUG:-frontend-chat-3rd}
      EVENT_TITLE: ${EVENT_TITLE:-프론트엔드 단톡방 3주년}
      EVENT_QUESTION: ${EVENT_QUESTION:?set EVENT_QUESTION}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci --include=dev && npm run db:migrate && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-frontend_chat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frontend_chat}
      AUTH_PEPPER: ${AUTH_PEPPER:?set AUTH_PEPPER}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      INVITE_CODE: ${INVITE_CODE:?set INVITE_CODE}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-host}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      EVENT_SLUG: ${EVENT_SLUG:-frontend-chat-3rd}
      EVENT_TITLE: ${EVENT_TITLE:-프론트엔드 단톡방 3주년}
      EVENT_QUESTION: ${EVENT_QUESTION:?set EVENT_QUESTION}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
  caddy_data:
  caddy_config:
